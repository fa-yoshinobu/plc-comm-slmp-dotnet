name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check release workflows do not auto-publish
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1
      - name: Check canonical SLMP profile JSONs
        shell: pwsh
        run: .\scripts\update_slmp_profile_jsons.ps1 -FailIfChanged

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore PlcComm.Slmp.sln

      - name: Build
        run: dotnet build PlcComm.Slmp.sln -c Release --no-restore

      - name: Test
        run: dotnet test PlcComm.Slmp.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Verify exported source archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "plc-comm-slmp-dotnet-source.zip"
          $extract = Join-Path $env:RUNNER_TEMP "plc-comm-slmp-dotnet-source"
          git archive --format=zip --output=$archive HEAD
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          dotnet restore (Join-Path $extract "PlcComm.Slmp.sln")
          dotnet build (Join-Path $extract "PlcComm.Slmp.sln") -c Release --no-restore
          dotnet test (Join-Path $extract "PlcComm.Slmp.sln") -c Release --no-build

      - name: Format check
        run: dotnet format PlcComm.Slmp.sln --verify-no-changes --no-restore

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload validation reports
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: internal_docs/validation/reports/**
          if-no-files-found: ignore
          retention-days: 7
